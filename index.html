<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>UbeKeso Cart | Ube-Kesoturon, crispy ube &amp; cheese turon in Cebu City</title>
  <meta name="description" content="Order ahead from UbeKeso Cart: crispy ube &amp; cheese turon, ready for pickup in Cebu City.">
  <meta name="theme-color" content="#5B2D8E">
  <link rel="icon" type="image/png" href="media/logo-icon.png">
  <link rel="apple-touch-icon" href="media/logo-icon.png">

  <link rel="preload" as="image" href="media/logo-small.jpg">
  <link rel="preconnect" href="https://pyscript.net">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./extra.css">
  <style>
    /* A signed-in owner/staff member should never see the customer page flash by. */
    html.has-session #screen { visibility: hidden; }
  </style>
  <script>
    /* Runs before first paint: skip the customer landing for signed-in staff. */
    try { if (localStorage.getItem("ubekeso_token")) document.documentElement.classList.add("has-session"); } catch (e) {}
  </script>

  <link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>
</head>
<body>
  <main id="site" class="no-tabs">
    <div id="screen">
      <!-- Complete landing page, pre-built so it is on screen instantly (no loading screen).
           main.py adopts this exact markup once Python is ready, so nothing changes or jumps. -->
      <div class="head"><div class="row top-row">
        <div class="brand-row">
          <img class="brand-mini" src="media/logo-small.jpg" alt="" width="48" height="48">
          <div><div class="eyebrow">Cebu City &middot; Pickup</div><h1>UbeKeso Cart</h1></div>
        </div>
        <button class="settings-btn" data-action="open-settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3 1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8 1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
      </div></div>
      <div class="body landing">
        <div class="card promo"><div class="promo-title">Watch: Ube-Kesoturon</div>
          <video class="promo-video" data-auto="1" autoplay muted loop playsinline controls preload="auto" poster="media/logo.jpg" src="media/promo.mp4">Your browser cannot play this video.</video>
        </div>
        <div class="section-title" style="margin-top:0">Order ahead</div>
        <div class="card product">
          <div class="top"><div class="photo">🍠</div>
            <div><div class="name">Ube cheese turon</div><div class="muted">₱25 per piece</div></div></div>
          <div class="stepper-row"><span class="muted">Quantity</span>
            <div class="stepper">
              <button data-action="cqty" data-arg="-1" aria-label="Less" disabled>&minus;</button>
              <span class="qty">1</span>
              <button class="plus" data-action="cqty" data-arg="1" aria-label="More">+</button>
            </div></div>
        </div>
        <div class="card row-between">
          <div><b>Extra cheese</b><div class="muted small">+₱5 per piece</div></div>
          <label class="switch"><input type="checkbox" data-change="cextra" aria-label="Extra cheese"><span class="slider"></span></label>
        </div>
        <div class="card">
          <div class="field" style="margin:0"><label for="c-pickup">Pickup time today</label>
            <input id="c-pickup" type="time" data-change="cpickup" value="">
            <p class="field-error" id="cp-error"></p></div>
        </div>
        <div><div class="section-label">Pay at pickup</div>
          <div class="seg">
            <button class="on" data-action="cpay" data-arg="cash">Cash</button>
            <button class="" data-action="cpay" data-arg="ewallet">E-wallet</button>
          </div></div>
        <button class="btn btn-outline" data-action="go" data-arg="about">About us &amp; FAQs</button>
      </div>
      <div class="pinned">
        <div class="total-line"><span>Total &middot; 1 piece</span><span class="amt">₱25</span></div>
        <button class="btn btn-primary" data-action="place-order">Place order ₱25</button>
      </div>
    </div>
    <nav id="tabbar" aria-label="Main tabs"></nav>
    <div id="modal-root"></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </main>

  <script>
    /* Default pickup time (now + 30 min) so the pre-built form matches what main.py draws. */
    (function () {
      try {
        var d = new Date(Date.now() + 30 * 60 * 1000), p = function (n) { return (n < 10 ? "0" : "") + n; };
        document.getElementById("c-pickup").value = p(d.getHours()) + ":" + p(d.getMinutes());
      } catch (e) {}
    })();
  </script>
  <script type="py" src="./main.py" config="./pyscript.toml"></script>
</body>
</html>
